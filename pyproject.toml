[project]
name = "autonomous-cognitive-engine"
version = "0.1.0"
description = "Autonomous Cognitive Engine for Deep Research and Long-Horizon Tasks"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-community>=0.3.0",
    "tavily-python>=0.5.0",
    "langsmith>=0.1.0",
    "python-dotenv>=1.0.0",
    "colorlog>=6.0.0",
    "rich>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ipykernel>=6.0.0",
]